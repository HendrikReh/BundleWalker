[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: opt-in live-model quality evaluations (requires BUNDLEWALKER_EVAL_MODEL)",
]

[tool.ruff]
extend-exclude = [
    "docs/superpowers/plans",
    "docs/superpowers/specs",
]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests", "benchmarks", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
