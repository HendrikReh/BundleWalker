[project]
name = "bundlewalker"
version = "0.5.0"
description = "Build a review-first personal knowledge wiki with OKF and PydanticAI."
readme = "README.md"
license = "GPL-3.0-or-later AND CC0-1.0"
license-files = [
    "LICENSE",
    "LICENSES/CC0-1.0.txt",
    "LICENSE-SCOPE.md",
    "THIRD_PARTY_NOTICES.md",
]
requires-python = ">=3.13,<3.15"
authors = [{ name = "Hendrik Reh" }]
maintainers = [{ name = "Hendrik Reh" }]
keywords = [
    "knowledge-base",
    "markdown",
    "mcp",
    "okf",
    "pydantic-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jsonschema>=4.26,<5",
    "markdown-it-py>=4.0.0",
    "mcp>=1.28.1,<2",
    "pydantic-ai>=2.10.0",
    "pyyaml>=6.0.0",
    "starlette>=1.3.1,<2",
    "typer>=0.16.0",
    "uvicorn>=0.51,<1",
]

[project.urls]
Homepage = "https://github.com/HendrikReh/BundleWalker"
Documentation = "https://github.com/HendrikReh/BundleWalker#documentation"
Repository = "https://github.com/HendrikReh/BundleWalker"
Issues = "https://github.com/HendrikReh/BundleWalker/issues"
Changelog = "https://github.com/HendrikReh/BundleWalker/blob/master/CHANGELOG.md"

[project.scripts]
bundlewalker = "bundlewalker.cli:app"
bundlewalker-mcp = "bundlewalker.interfaces.mcp:main"
bundlewalker-web = "bundlewalker.interfaces.web.server:main"

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "pyright>=1.1.400",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
    "twine>=6,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
exclude = ["benchmarks/**"]
packages = ["src/bundlewalker"]

[tool.hatch.build.targets.sdist]
exclude = [".superpowers/**", "benchmarks/**"]

[tool.hatch.build.targets.sdist.force-include]
